<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nakoda Admin Control Center</title>
<link rel="icon" type="image/png" href="/assets/nakoda-logos.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
.page-loading{min-height:70vh;display:grid;place-items:center;color:#9e4a2a;font-weight:800}
:root{--bg:#f7f0ec;--panel:#fffdfb;--ink:#2b231f;--muted:#766963;--line:#eaded6;--primary:#9e4a2a;--deep:#713018;--soft:#f6dfd5;--success:#187a51;--danger:#c4443e;--shadow:0 18px 50px #4a281414}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#9e4a2a12,transparent 35%),var(--bg);color:var(--ink);font:13px "Plus Jakarta Sans",sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}.login-art{padding:46px;color:#fff;background:linear-gradient(145deg,#332016,#a34d2a)}.login-art h1{font:700 clamp(38px,6vw,64px) "Playfair Display";line-height:.95;margin:70px 0 20px}.login-form{padding:42px}.login-form h2,.page-title{font:700 30px "Playfair Display";margin:0 0 8px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--primary)}.muted{color:var(--muted)}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;color:var(--muted);font-weight:700;font-size:12px}.form input,.form select,.form textarea,.search{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;outline:0;color:var(--ink)}.form input:focus,.form select:focus,.form textarea:focus,.search:focus{border-color:var(--primary)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:linear-gradient(135deg,var(--primary),#c86b41);color:#fff;box-shadow:0 9px 20px #9e4a2a2b}.soft{background:var(--soft);color:var(--deep)}.outline{background:#fff;border:1px solid var(--line)}.danger{background:#fff0ee;color:var(--danger)}.error{color:var(--danger);font-weight:700;min-height:18px}.check{display:flex!important;grid-template-columns:auto 1fr;align-items:center;gap:8px}.check input{width:auto}
.app{min-height:100vh}.sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:250px;background:#30251f;color:#f9eee8;padding:20px 14px;transition:.2s;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:5px 10px 24px}.mark{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:url('/assets/nakoda-logos.png') right top / 256% auto no-repeat;color:transparent;font:700 22px "Playfair Display";overflow:hidden}.brand b{display:block;font-size:16px}.brand small{display:block;color:#cdbdb5;font-size:9px;letter-spacing:.1em;text-transform:uppercase}.nav{display:grid;gap:3px;overflow:auto}.nav a,.nav button{display:flex;gap:11px;align-items:center;color:#cfbeb5;padding:11px 12px;border-radius:10px;background:transparent;text-align:left}.nav a:hover,.nav a.active{background:#a04d2c;color:#fff}.nav .logout{margin-top:12px;border-top:1px solid #ffffff1f;padding-top:17px;color:#ffb8af}.main{margin-left:250px;min-width:0}.header{height:70px;background:#fffdfbdd;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px;padding:0 28px;position:sticky;top:0;z-index:10}.toggle{font-size:21px;background:none;color:var(--ink)}.global-search{flex:1;max-width:520px}.profile{margin-left:auto;display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--deep);display:grid;place-items:center;font-weight:800;object-fit:cover}.content{max-width:1480px;padding:30px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.hero h1{font:700 clamp(29px,4vw,44px) "Playfair Display";margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#fffdfbdd;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow);margin-bottom:18px}.kpi small{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10px}.kpi b{font-size:25px;display:block;margin-top:8px}.kpi span{display:block;color:var(--muted);margin-top:5px;font-size:11px}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.card h2{font:700 22px "Playfair Display";margin:0 0 14px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e5f5ec;color:var(--success);font-size:10px;font-weight:800;text-transform:uppercase}.badge.warn{background:#fff0d8;color:#96651e}.badge.danger{background:#fee9e7;color:var(--danger)}.badge.neutral{background:#eee9e6;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:34px;border:1px dashed var(--line);border-radius:12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar .search{flex:1;min-width:180px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:15px}.tabs button{white-space:nowrap}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.form-grid .wide{grid-column:1/-1}.toast{position:fixed;right:22px;bottom:22px;background:#30251f;color:#fff;padding:13px 18px;border-radius:12px;z-index:50;box-shadow:var(--shadow)}.activity{display:grid;gap:0}.activity div{padding:11px 0;border-bottom:1px solid var(--line)}.activity div:last-child{border:0}.modal{position:fixed;inset:0;background:#2b231f66;display:grid;place-items:center;z-index:40;padding:18px}.modal>div{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:18px;padding:24px}
.call-overlay{position:fixed;inset:0;z-index:100;background:#211712dd;display:none;place-items:center;padding:20px}.call-overlay.show{display:grid}.call-card{width:min(520px,100%);padding:28px;border-radius:25px;background:#fffdfb;text-align:center;box-shadow:0 25px 80px #0008}.call-card h2{font:700 32px "Playfair Display";margin:8px 0}.call-video video{width:100%;max-height:360px;object-fit:cover;border-radius:16px;background:#1d1512}.call-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.admin-notification-wrap{position:relative}.admin-notification-panel{position:absolute;right:0;top:48px;width:min(360px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:none;z-index:30}.admin-notification-panel.show{display:block}.admin-notification-panel article{padding:10px 4px;border-bottom:1px solid var(--line)}.admin-notification-panel article.unread{background:#fff5ef;border-radius:8px}.admin-notification-panel p{margin:5px 0;color:var(--muted);font-size:11px}.admin-notification-panel small{color:var(--muted)}
.support-chat-card{display:grid;grid-template-rows:auto minmax(260px,1fr) auto;min-height:min(720px,calc(100vh - 150px));overflow:hidden}.support-chat-thread{min-height:0;max-height:calc(100vh - 330px);overflow-y:auto;overscroll-behavior:contain;padding:8px 4px}.support-composer{position:sticky;bottom:0;background:#fffdfb;padding-top:14px}.support-composer textarea{width:100%;resize:none}.new-message-indicator{position:absolute;right:26px;bottom:100px;z-index:2}.admin-notification-panel{position:absolute;right:0;top:48px;width:min(360px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:none;z-index:30}.admin-notification-panel.show{display:block}.admin-notification-panel article{padding:10px 4px;border-bottom:1px solid var(--line)}.admin-notification-panel article.unread{background:#fff5ef;border-radius:8px}.admin-notification-panel p{margin:5px 0;color:var(--muted);font-size:11px}.admin-notification-panel small{color:var(--muted)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.sidebar{width:72px}.sidebar .brand b,.sidebar .brand small,.sidebar .nav span{display:none}.sidebar .brand{justify-content:center;padding-left:0;padding-right:0}.nav a,.nav button{justify-content:center}.main{margin-left:72px}.sidebar.open{width:250px}.sidebar.open .brand b,.sidebar.open .brand small,.sidebar.open .nav span{display:block}.sidebar.open .brand{justify-content:flex-start;padding-left:10px;padding-right:10px}.sidebar.open .nav a,.sidebar.open .nav button{justify-content:flex-start}}
@media(max-width:650px){.login-card{grid-template-columns:1fr}.login-art{display:none}.login-form{padding:28px 20px}.content{padding:20px 12px}.header{padding:0 12px}.global-search{display:none}.profile small{display:none}.hero{display:block}.hero .actions{margin-top:12px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:14px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.page-title{font-size:28px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.sidebar{width:58px}.main{margin-left:58px}.content{padding:16px 8px}}
</style>
</head>
<body><div id="app"></div><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
const API=(window.NAKODA_API_BASE||'https://nakoda-kitchen-store.onrender.com').replace(/\/$/,''), token=()=>localStorage.getItem('nakoda_admin_token')||'', saved=()=>JSON.parse(localStorage.getItem('nakoda_admin_user')||'null');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v)||0);
const date=v=>v?new Date(v).toLocaleDateString('en-IN'):'—';
function toast(message){const n=document.createElement('div');n.className='toast';n.textContent=message;document.body.appendChild(n);setTimeout(()=>n.remove(),2800)}
const apiCache=new Map(),API_CACHE_MS=15000;
async function api(url,opts={}){const method=(opts.method||'GET').toUpperCase(),key=method+' '+url;if(method==='GET'){const cached=apiCache.get(key);if(cached&&Date.now()-cached.time<API_CACHE_MS)return cached.data} else apiCache.clear();const request=(async()=>{const headers={...(token()?{Authorization:'Bearer '+token()}:{}),...(opts.headers||{})};if(!(opts.body instanceof FormData))headers['Content-Type']='application/json';const r=await fetch(API+url,{...opts,headers});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('nakoda_admin_token');location.href='/admin/login';throw Error('Authentication required.')}if(!r.ok)throw Error(d.error||'Request failed');return d})();if(method==='GET')apiCache.set(key,{time:Date.now(),data:request});return request}
function prefetch(url){if(url&&!apiCache.has('GET '+url))api(url).catch(()=>{})}
function logout(){localStorage.removeItem('nakoda_admin_token');localStorage.removeItem('nakoda_admin_user');location.href='/admin/login'}
function icon(s){return `<span aria-hidden="true">${s}</span>`}
const links=[['/admin','⌂','Dashboard'],['/admin/support','☏','Support inbox'],['/admin/orders','▣','Orders'],['/admin/products','▤','Products'],['/admin/categories','⌘','Categories'],['/admin/inventory','◫','Inventory'],['/admin/customers','♙','Customers'],['/admin/transactions','₹','Transactions'],['/admin/enquiries','✉','Enquiries'],['/admin/banners','▰','Banners'],['/admin/campaigns','◈','Campaigns'],['/admin/offers','%','Offers'],['/admin/analytics','◒','Analytics'],['/admin/business-health','♥','Business health'],['/admin/system-health','⚕','System health'],['/admin/maintenance','♻','Maintenance'],['/admin/reports','▥','Reports'],['/admin/notifications','♢','Notifications'],['/admin/audit-logs','◌','Audit logs'],['/admin/settings','⚙','Settings']];
function shell(active,body){const u=saved()||{};setTimeout(()=>{bindAdminNotificationBell();bindAdminGlobalCallSocket()},0);return `<div class="app"><aside class="sidebar" id="sidebar"><a class="brand" href="/admin" onclick="event.preventDefault();navigate('/admin')" onmouseenter="prefetch('/api/admin/dashboard')"><span class="mark">N</span><span><b>NAKODA ADMIN</b><small>Control Center</small></span></a><nav class="nav">${links.map(x=>`<a class="${active===x[0]?'active':''}" href="${x[0]}" onmouseenter="prefetch('${x[0]==='/admin' ? '/api/admin/dashboard' : x[0]==='/admin/support' ? '/api/admin/support/conversations' : ''}')" onclick="event.preventDefault();navigate('${x[0]}')">${icon(x[1])}<span>${x[2]}</span></a>`).join('')}<button class="logout" onclick="logout()">${icon('↪')}<span>Logout</span></button></nav></aside><section class="main"><header class="header"><button class="toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><input id="globalSearch" class="search global-search" placeholder="Search orders, products, customers…" onkeydown="if(event.key==='Enter')location.href='/admin/search?q='+encodeURIComponent(this.value)"><div class="profile"><div class="admin-notification-wrap"><button class="btn outline" id="adminNotificationToggle" aria-label="Admin notifications">🔔 <b id="adminNotificationCount"></b></button><div class="admin-notification-panel" id="adminNotificationPanel"><div class="toolbar"><b>Admin notifications</b><a href="/admin/notifications" onclick="event.preventDefault();navigate('/admin/notifications')" class="muted" style="margin-left:auto">View all</a></div><div id="adminNotificationList"><span class="muted">Loading…</span></div></div></div><img class="avatar" src="${API}/uploads/nakoda-owner.jpe" alt="Nakoda owner"><div><b>${esc(u.name||'Admin')}</b><small class="muted"> · ${esc(u.role||'ADMIN')}</small></div><button class="btn outline" onclick="logout()">Logout</button></div></header><main class="content">${body}</main></section></div>`}
function badge(status){const s=String(status||'').replaceAll('_',' '), c=/out|low|pending|processing|in progress/i.test(s)?'warn':/cancel|failed|out of stock/i.test(s)?'danger':/inactive|closed|returned/i.test(s)?'neutral':'';return `<span class="badge ${c}">${esc(s)}</span>`}
async function loadAdminNotifications(){const panel=document.getElementById('adminNotificationPanel');if(!panel)return;try{const d=await api('/api/admin/notifications'),rows=d.notifications||[],count=Number(d.unread_count||0);const counter=document.getElementById('adminNotificationCount');counter.textContent=count?`(${count})`:'';document.getElementById('adminNotificationList').innerHTML=rows.length?rows.slice(0,8).map(n=>`<article class="${n.is_read?'':'unread'}"><div class="toolbar"><b>${esc(n.title)}</b><small style="margin-left:auto">${date(n.created_at)}</small></div><p>${esc(n.message)}</p>${n.order_number?`<a class="btn soft" href="/admin/orders/${encodeURIComponent(n.order_number)}">View order</a>`:''}${n.is_read?'':'<button class="btn soft" onclick="readNotification('+n.id+')">Mark read</button>'}</article>`).join(''):'<div class="empty">No notifications.</div>'}catch(e){}}
function bindAdminNotificationBell(){const toggle=document.getElementById('adminNotificationToggle'),panel=document.getElementById('adminNotificationPanel');if(!toggle||!panel)return;toggle.onclick=()=>{panel.classList.toggle('show');if(panel.classList.contains('show'))loadAdminNotifications()};loadAdminNotifications();if(!window.adminNotificationTimer)window.adminNotificationTimer=window.setInterval(loadAdminNotifications,30000)}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty">No records found.</div></td></tr>`}</tbody></table></div>`}
async function login(){if(token())return navigate('/admin');document.getElementById('app').innerHTML=`<main class="login"><div class="login-card"><section class="login-art"><span class="eyebrow" style="color:#ffd8c8">Nakoda Kitchen Wares</span><h1>Operate with clarity.</h1><p>One calm control center for orders, products, inventory and customer care.</p></section><form class="login-form" id="login"><span class="eyebrow">Secure admin access</span><h2>NAKODA ADMIN</h2><p class="muted">Sign in with an account assigned the ADMIN role.</p><div class="form"><label>Email / Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><label class="check"><input type="checkbox" name="remember"> Remember me</label><div class="error"></div><button class="btn primary">Login to control center</button></div><p class="muted"><a href="/forgot-password">Forgot password?</a></p></form></div></main>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=e.target,b=Object.fromEntries(new FormData(f));b.remember=f.remember.checked;try{const r=await api('/api/admin/login',{method:'POST',body:JSON.stringify(b)});localStorage.setItem('nakoda_admin_token',r.token);localStorage.setItem('nakoda_admin_user',JSON.stringify(r.user));location.href='/admin'}catch(x){f.querySelector('.error').textContent=x.message}}}
function navigate(p){history.pushState({},'',p);render()}
async function supportInbox(){const d=await api('/api/admin/support/conversations');document.getElementById('app').innerHTML=shell('/admin/support',`<div class="hero"><div><span class="eyebrow">Customer care</span><h1>Support inbox</h1><p class="muted">Click any conversation to read the customer message and reply.</p></div></div><section class="card">${table(['Customer','Topic','Last message','Status','Updated'],(d.conversations||[]).map(c=>`<tr style="cursor:pointer" onclick="location.href='/admin/support/${c.id}'"><td><b>${esc(c.customer_name||c.user_name||'Customer')}</b><small class="muted"><br>${esc(c.customer_email||'')}</small></td><td><b>${esc(c.subject||c.reason||'Support')}</b></td><td>${esc(c.last_message||'No message yet')}</td><td>${badge(c.status)}</td><td>${date(c.updated_at)}</td></tr>`).join(''))}</section>`)}
let nakodaSocket,nakodaPc,nakodaStream,nakodaCallId,nakodaConversationId,nakodaCallType,nakodaPendingSignals=[],nakodaPendingIce=[],nakodaTimer,nakodaStartedAt,adminCallPollTimer,adminSeenCallIds=new Set();
function adminCallMessage(m){const body=String(m.message||m.body||''),call=body.match(/^\[\[NAKODA_CALL:[^:]+:(voice|video)\]\]$/);return `<article data-message-id="${esc(m.id||'')}" style="padding:12px;border:1px solid var(--line);border-radius:12px;background:${m.sender_type==='ADMIN'?'#fff5ef':'#fff'}"><b>${esc(m.sender_name||m.sender_type||'Customer')}</b><p>${call?`Started a ${call[1]} call`:esc(body)}</p><small class="muted">${m.created_at?new Date(m.created_at).toLocaleString('en-IN'):''}</small></article>`}
function chatNearBottom(thread){return thread.scrollHeight-thread.scrollTop-thread.clientHeight<80}
function scrollAdminChat(thread){thread.scrollTo({top:thread.scrollHeight,behavior:'smooth'});document.getElementById('newMessageIndicator')?.classList.add('hidden')}
function appendAdminMessage(message){const thread=document.getElementById('adminChatThread');if(!thread||!message||thread.querySelector(`[data-message-id="${message.id}"]`))return;const shouldScroll=chatNearBottom(thread);thread.insertAdjacentHTML('beforeend',adminCallMessage(message));if(shouldScroll)scrollAdminChat(thread);else document.getElementById('newMessageIndicator')?.classList.remove('hidden')}
function callOverlay(){if(document.getElementById('nakodaCallOverlay'))return;document.body.insertAdjacentHTML('beforeend','<div id="nakodaCallOverlay" class="call-overlay"><div class="call-card"><div class="eyebrow">NAKODA VOICE CALL</div><h2 id="callTitle">Incoming call</h2><p id="callStatus">Calling…</p><div id="callTimer" class="muted">00:00</div><audio id="remoteCallAudio" autoplay playsinline></audio><button class="btn soft hidden" id="enableCallAudio">Enable audio</button><div class="call-actions"><button class="btn primary" id="acceptCall">Accept</button><button class="btn danger" id="declineCall">Decline</button><button class="btn soft" id="messageCaller">Message</button><button class="btn soft hidden" id="muteCall">Mute</button><button class="btn danger hidden" id="endCall">End call</button></div></div></div>');document.getElementById('enableCallAudio').onclick=playAdminRemoteAudio}
function showCall(type,title,status){callOverlay();document.getElementById('nakodaCallOverlay').classList.add('show');document.getElementById('callTitle').textContent=title;document.getElementById('callStatus').textContent=status;document.getElementById('acceptCall').classList.toggle('hidden',status!=='Incoming call');document.getElementById('declineCall').classList.toggle('hidden',status!=='Incoming call');document.getElementById('messageCaller').classList.toggle('hidden',status!=='Incoming call');document.getElementById('muteCall').classList.toggle('hidden',status!=='Connected');document.getElementById('endCall').classList.toggle('hidden',status==='Incoming call');document.getElementById('endCall').onclick=endAdminCall;document.getElementById('muteCall').onclick=toggleAdminMute}
function closeCall(){nakodaPc?.close();nakodaPc=null;nakodaStream?.getTracks().forEach(t=>t.stop());nakodaStream=null;clearInterval(nakodaTimer);document.getElementById('nakodaCallOverlay')?.classList.remove('show');const audio=document.getElementById('remoteCallAudio');if(audio)audio.srcObject=null}
function setupCallSocket(id){nakodaSocket?.disconnect();nakodaConversationId=Number(id);nakodaSocket=io(API,{auth:{token:token()}});const join=()=>nakodaConversationId&&nakodaSocket.emit('support_join',{conversation_id:nakodaConversationId});nakodaSocket.on('connect',join);nakodaSocket.on('connect_error',e=>console.error('Nakoda socket connection failed',e));if(nakodaSocket.connected)join();nakodaSocket.on('support_message',d=>{if(Number(d.conversation_id)!==nakodaConversationId)return;if(location.pathname==='/admin/support')supportInbox();else if(location.pathname.startsWith('/admin/support/'))appendAdminMessage(d.message)});nakodaSocket.on('incoming_call',d=>{nakodaConversationId=Number(d.conversation_id);join();nakodaCallId=d.call_id;nakodaPendingSignals=[];nakodaPendingIce=[];showCall('voice',`${d.caller_name} is calling`,'Incoming call');document.getElementById('acceptCall').onclick=()=>acceptCall();document.getElementById('declineCall').onclick=()=>respondCall('rejected');document.getElementById('messageCaller').onclick=()=>{closeCall();location.href='/admin/support/'+nakodaConversationId}});nakodaSocket.on('call_response',d=>{if(d.call_id!==nakodaCallId)return;if(d.response==='rejected'){showCall('voice','Call rejected','NAKODA Support is unavailable right now.');setTimeout(closeCall,1800)}});nakodaSocket.on('call_state',d=>{if(d.call_id!==nakodaCallId)return;if(d.state==='CONNECTED')startAdminTimer();if(d.state==='ENDED'||d.state==='REJECTED'){showCall('voice',d.state==='ENDED'?'Call ended':'Call rejected',d.state==='ENDED'?'The other person ended the call':'NAKODA Support is unavailable right now.');setTimeout(closeCall,1200)}});nakodaSocket.on('call_signal',async d=>{if(d.call_id!==nakodaCallId)return;const signal=d.signal;try{if(signal.type==='offer'&&!nakodaPc){nakodaPendingSignals.push(signal);return}if(signal.type==='offer'){await nakodaPc.setRemoteDescription(signal);for(const candidate of nakodaPendingIce.splice(0))await nakodaPc.addIceCandidate(candidate);const answer=await nakodaPc.createAnswer();await nakodaPc.setLocalDescription(answer);nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:answer})}else if(signal.type==='answer'&&nakodaPc){await nakodaPc.setRemoteDescription(signal);for(const candidate of nakodaPendingIce.splice(0))await nakodaPc.addIceCandidate(candidate)}else if(signal.candidate&&nakodaPc){if(nakodaPc.remoteDescription)await nakodaPc.addIceCandidate(signal);else nakodaPendingIce.push(signal)}}catch(e){console.error('Nakoda call signaling failed',e)}})}
function bindAdminGlobalCallSocket(){if(!nakodaSocket)setupCallSocket(0);if(adminCallPollTimer)return;let firstPoll=true;adminCallPollTimer=setInterval(async()=>{try{const d=await api('/api/admin/support/conversations');for(const c of d.conversations||[]){const text=String(c.last_message||c.last_message_body||'');const match=text.match(/^\[\[NAKODA_CALL:([^:]+):(voice|video)\]\]$/);if(!match)continue;if(firstPoll){adminSeenCallIds.add(match[1]);continue}if(adminSeenCallIds.has(match[1]))continue;adminSeenCallIds.add(match[1]);nakodaConversationId=Number(c.id);nakodaCallId=match[1];nakodaCallType=match[2];nakodaSocket.emit('support_join',{conversation_id:nakodaConversationId});showCall(nakodaCallType,`${c.customer_name||'Customer'} is calling`,'Incoming call');document.getElementById('acceptCall').onclick=()=>acceptCall();document.getElementById('declineCall').onclick=()=>respondCall('declined');document.getElementById('messageCaller').onclick=()=>{closeCall();location.href='/admin/support/'+nakodaConversationId}}firstPoll=false}catch(e){}} ,2000)}

function prepareAdminPeer(){nakodaPc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});nakodaPc.onconnectionstatechange=()=>{console.log('Nakoda peer connection state',nakodaPc.connectionState);if(nakodaPc.connectionState==='connected'){showCall('voice','Connected','Call connected');startAdminTimer();nakodaSocket.emit('call_state',{conversation_id:nakodaConversationId,call_id:nakodaCallId,state:'CONNECTED'})}if(['failed','disconnected','closed'].includes(nakodaPc.connectionState))endAdminCall(false)};nakodaPc.ontrack=e=>{const audio=document.getElementById('remoteCallAudio');if(!audio)return;audio.srcObject=e.streams?.[0]||new MediaStream([e.track]);playAdminRemoteAudio()};nakodaPc.onicecandidate=e=>e.candidate&&nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:{candidate:e.candidate}})}
async function startAdminCall(id){try{setupCallSocket(id);nakodaCallId=crypto.randomUUID();nakodaCallType='voice';prepareAdminPeer();nakodaStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});nakodaStream.getTracks().forEach(track=>nakodaPc.addTrack(track,nakodaStream));const offer=await nakodaPc.createOffer();await nakodaPc.setLocalDescription(offer);nakodaSocket.emit('call_invite',{conversation_id:nakodaConversationId,call_id:nakodaCallId,call_type:'voice',caller_name:(saved()||{}).name||'Nakoda Admin'});nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:offer});showCall('voice','Calling customer…','Ringing…')}catch(e){toast(e.message)}}
async function acceptCall(){try{nakodaSocket.emit('call_response',{conversation_id:nakodaConversationId,call_id:nakodaCallId,response:'accepted'});prepareAdminPeer();nakodaStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});nakodaStream.getTracks().forEach(track=>nakodaPc.addTrack(track,nakodaStream));showCall('voice','Connecting…','Connecting…');const offer=nakodaPendingSignals.shift();if(offer){await nakodaPc.setRemoteDescription(offer);const answer=await nakodaPc.createAnswer();await nakodaPc.setLocalDescription(answer);nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:answer})}}catch(e){toast(e.message)}}

function startAdminTimer(){if(nakodaTimer)return;nakodaStartedAt=Date.now();nakodaTimer=setInterval(()=>{const seconds=Math.floor((Date.now()-nakodaStartedAt)/1000),node=document.getElementById('callTimer');if(node)node.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`},1000)}

eturn;form.requestSubmit()}});form.onsubmit=async e=>{e.preventDefault();if(!textarea.value.trim())return;const button=form.querySelector('button'),message=textarea.value;button.disabled=true;button.textContent='Sending…';try{const result=await api('/api/admin/support/conversations/'+encodeURIComponent(id)+'/messages',{method:'POST',body:JSON.stringify({message})});appendAdminMessage((result.messages||[]).at(-1));textarea.value='';textarea.focus()}catch(x){form.querySelector('.error').textContent=x.message}finally{button.disabled=false;button.textContent='Send reply'}}}

async function openProduct(item={}){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div><div class="hero"><h2>${item.id?'Edit product':'Add product'}</h2><button class="btn outline" onclick="closeModal()">×</button></div>${productForm(item)}</div></div>`);const form=document.getElementById('entityForm'),category=document.getElementById('productCategory');try{const c=await api('/api/categories');category.innerHTML='<option value="">Choose category…</option>'+c.map(x=>`<option value="${x.id}" ${String(x.id)===String(item.category_id||'')?'selected':''}>${esc(x.name)}</option>`).join('')}catch(e){}const updateDiscount=()=>{const price=Number(form.price.value),mrp=Number(form.compare_at_price.value);document.getElementById('productDiscount').value=mrp>0&&price<=mrp?Math.round((mrp-price)/mrp*100):''};form.price.oninput=updateDiscount;form.compare_at_price.oninput=updateDiscount;updateDiscount();document.getElementById('productImages').onchange=async event=>{const preview=document.getElementById('productPreview');preview.innerHTML='';for(const file of event.target.files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5242880){form.querySelector('.error').textContent='Each image must be JPG, PNG or WEBP up to 5 MB.';continue}const local=document.createElement('img');local.src=URL.createObjectURL(file);local.style='width:76px;height:76px;object-fit:cover;border-radius:10px;margin-right:5px';preview.appendChild(local);const body=new FormData();body.append('image',file);try{const uploaded=await api('/api/admin/uploads/product-image',{method:'POST',headers:{},body});form.image_url.value=uploaded.url}catch(e){form.querySelector('.error').textContent=e.message}}};form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const x of ['is_active','is_featured','is_bestseller','is_new_arrival','is_trending'])data[x]=e.target[x].checked;try{await api('/api/admin/products'+(item.id?'/'+item.id:''),{method:item.id?'PUT':'POST',body:JSON.stringify(data)});closeModal();toast(item.id?'Product updated.':'Product created.');products()}catch(x){e.target.querySelector('.error').textContent=x.message}}}
function closeModal(){document.getElementById('modal')?.remove()}

async function notifications(){const d=await api('/api/admin/notifications');document.getElementById('app').innerHTML=shell('/admin/notifications',`<div class="hero"><div><span class="eyebrow">Operations inbox</span><h1>Notifications</h1></div></div><section class="card">${d.notifications.length?d.notifications.map(n=>`<article style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="toolbar"><b>${esc(n.title)}</b><span class="muted" style="margin-left:auto">${date(n.created_at)}</span>${n.is_read?'':'<button class="btn soft" onclick="readNotification('+n.id+')">Mark read</button>'}</div><p>${esc(n.message)}</p></article>`).join(''):'<div class="empty">You are all caught up.</div>'}</section>`)}
async function readNotification(id){await api('/api/admin/notifications/'+id+'/read',{method:'POST'});if(location.pathname==='/admin/notifications')notifications();else loadAdminNotifications()}
async function settings(){const [d,s]=await Promise.all([api('/api/admin/profile'),api('/api/admin/settings')]),u=d.user||{},store=Object.fromEntries((s.settings||[]).map(x=>[x.setting_key,x.setting_value]));document.getElementById('app').innerHTML=shell('/admin/settings',`<div class="hero"><div><span class="eyebrow">Administration</span><h1>Profile & settings</h1></div></div><section class="card"><h2>Admin profile</h2><form class="form" id="profileForm"><label>Name<input name="name" required value="${esc(u.name)}"></label><label>Email<input value="${esc(u.email)}" disabled></label><label>Mobile<input name="phone" value="${esc(u.phone||'')}"></label><label>Role<input value="${esc(u.role)}" disabled></label><div class="error"></div><button class="btn primary">Save profile</button></form></section><section class="card"><h2>Store information</h2><form class="form" id="settingsForm"><label>Business name<input name="business_name" value="${esc(store.business_name||'Nakoda Kitchen Wares & Plastic Items')}"></label><label>Address<input name="address" value="${esc(store.address||'Eklind Pura Road, RIICO Road')}"></label><div class="form-grid"><label>Mobile<input name="mobile" value="${esc(store.mobile||'9829741755')}"></label><label>WhatsApp<input name="whatsapp" value="${esc(store.whatsapp||'9829741206')}"></label><label>Business hours<input name="business_hours" value="${esc(store.business_hours||'10 AM – 10 PM')}"></label><label>COD available<select name="cod"><option ${store.cod!=='false'?'selected':''}>true</option><option ${store.cod==='false'?'selected':''}>false</option></select></label></div><div class="error"></div><button class="btn primary">Save store settings</button></form></section><section class="card"><h2>UPI payment</h2><p class="muted">Manual UPI only. Customer payments remain pending until an admin verifies the UTR.</p><form class="form" id="upiForm"><label class="check"><input type="checkbox" name="upi_enabled" ${store.upi_enabled!=='false'?'checked':''}> Enable UPI payment</label><label>UPI ID<input name="upi_id" required value="${esc(store.upi_id||'')}"></label><label>UPI display name<input name="upi_display_name" required maxlength="120" value="${esc(store.upi_display_name||'Nakoda Kitchen Wares')}"></label><label>UPI QR image (JPG, PNG or WEBP · max 5 MB)<input id="upiQr" type="file" accept="image/jpeg,image/png,image/webp"><span id="upiQrPreview">${store.upi_qr_url?`<img src="${esc(store.upi_qr_url)}" alt="Current UPI QR" style="width:180px;height:180px;object-fit:contain;border:1px solid var(--line);border-radius:12px"> <button type="button" class="btn danger" onclick="removeUpiQr()">Remove QR</button>`:'<span class="muted">No QR uploaded.</span>'}</span></label><div class="error"></div><button class="btn primary">Save payment settings</button></form></section>`);profileForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/profile',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const u2=saved();u2.name=e.target.name.value;localStorage.setItem('nakoda_admin_user',JSON.stringify(u2));toast('Profile saved.')}catch(x){e.target.querySelector('.error').textContent=x.message}};settingsForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({settings:Object.fromEntries(new FormData(e.target))})});toast('Store settings saved.')}catch(x){e.target.querySelector('.error').textContent=x.message}};const upiForm=document.getElementById('upiForm');document.getElementById('upiQr').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5242880){upiForm.querySelector('.error').textContent='QR must be JPG, PNG or WEBP up to 5 MB.';return}const body=new FormData();body.append('image',file);try{const uploaded=await api('/api/admin/uploads/upi-qr',{method:'POST',headers:{},body});document.getElementById('upiQrPreview').innerHTML='<img src="'+esc(uploaded.url)+'" alt="UPI QR" style="width:180px;height:180px;object-fit:contain;border:1px solid var(--line);border-radius:12px">';toast('QR uploaded. Save payment settings to enable UPI if needed.')}catch(x){upiForm.querySelector('.error').textContent=x.message}};upiForm.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.upi_enabled=e.target.upi_enabled.checked?'true':'false';try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({settings:data})});toast('Payment settings saved.');settings()}catch(x){e.target.querySelector('.error').textContent=x.message}}}
async function removeUpiQr(){if(!confirm('Remove the UPI QR image?'))return;try{await api('/api/admin/uploads/upi-qr',{method:'DELETE'});toast('UPI QR removed.');settings()}catch(e){toast(e.message)}}
window.addEventListener('popstate',()=>{window.location.reload()});render();
</script>
</body></html>
