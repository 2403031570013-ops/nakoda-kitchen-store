<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nakoda Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f8f1ee;--panel:#fffdfb;--soft:#f7e1d8;--ink:#2b231f;--muted:#6a5f5a;--line:#eaded6;--primary:#9e4a2a;--danger:#cf4a45;--shadow:0 18px 50px #4a281414}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#9e4a2a0d,transparent 38%),var(--bg);color:var(--ink);font:14px "Plus Jakarta Sans",sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1240px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}    .mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:url('/assets/nakoda-logos.png') left top / 256% auto no-repeat;color:transparent;font:700 25px "Playfair Display";overflow:hidden}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.top-actions{display:flex;gap:10px;align-items:center}.btn{padding:11px 16px;border-radius:12px;font-weight:800}.primary{background:linear-gradient(135deg,var(--primary),#c66a3d);color:#fff;box-shadow:0 10px 25px #9e4a2a2e}.soft{background:var(--soft);color:#7d3418}.outline{background:#fff;border:1px solid var(--line)}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}.side,.card{background:#ffffffd9;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.side{padding:14px;height:max-content;position:sticky;top:18px}.side-user{padding:16px;border-radius:18px;background:linear-gradient(145deg,#fff8f5,var(--soft));margin-bottom:12px}.avatar{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:800;font-size:19px}.side-user strong{display:block;margin-top:10px}.side-user small{color:var(--muted);word-break:break-word}.nav{display:grid;gap:4px}.nav a,.nav button{padding:11px 12px;border-radius:11px;text-align:left;background:transparent;color:var(--muted);font-weight:700}.nav a:hover,.nav a.active{background:var(--soft);color:#7d3418}.nav .logout{color:var(--danger);border-top:1px solid var(--line);margin-top:8px;padding-top:16px}.content{min-width:0}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.eyebrow{color:var(--primary);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:11px}.hero h1{font:700 clamp(28px,4vw,44px) "Playfair Display";margin:7px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border-radius:17px;background:#fff;border:1px solid var(--line)}.stat small{display:block;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.08em}.stat b{font-size:25px;display:block;margin-top:7px}.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:18px 0}.shortcut{padding:16px;background:#fff;border:1px solid var(--line);border-radius:17px;font-weight:800}.shortcut span{display:block;font-size:22px;margin-bottom:9px}.card{padding:20px;margin-bottom:18px}.card h2{font:700 25px "Playfair Display";margin:0 0 14px}.order{padding:15px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}.order:first-of-type{border-top:0}.order h3{margin:0 0 5px;font-size:15px}.tag{border-radius:999px;padding:6px 10px;background:#e9f8ef;color:#177b4f;font-weight:800;font-size:11px;white-space:nowrap}.tag.cancelled{background:#feeceb;color:var(--danger)}.form{display:grid;gap:12px;max-width:680px}.form label{display:grid;gap:6px;color:var(--muted);font-weight:700;font-size:12px}.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;color:var(--ink);outline:0}.form input:focus,.form textarea:focus{border-color:var(--primary)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.address,.transaction,.notice{padding:15px;border:1px solid var(--line);border-radius:15px;background:#fff;margin:10px 0}.address-head,.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.items{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;padding:10px;background:#fff;border:1px solid var(--line);border-radius:13px}.item img{width:60px;height:60px;object-fit:cover;border-radius:10px}.timeline{display:grid;gap:0;margin:18px 0}.step{display:flex;gap:12px;align-items:flex-start;min-height:54px}.step i{width:18px;height:18px;border:2px solid var(--line);border-radius:50%;margin-top:2px;background:#fff}.step.done i{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--soft)}.step b{display:block;text-transform:capitalize}.auth{max-width:980px;margin:8vh auto;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.auth-art{padding:38px;color:#fff;background:linear-gradient(150deg,#3d2013,#a34d2a)}.auth-art h1{font:700 45px "Playfair Display";line-height:1;margin:55px 0 15px}.auth-form{padding:32px;background:#fff}.auth-form h2{font:700 30px "Playfair Display";margin:0 0 6px}.error{color:var(--danger);min-height:20px;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.hidden{display:none!important}@media(max-width:800px){.wrap{padding:14px}.layout{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav a,.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.shortcuts{grid-template-columns:repeat(2,1fr)}.auth{grid-template-columns:1fr;margin:2vh auto}.auth-art{display:none}.hero{display:block}.two{grid-template-columns:1fr}}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat b{font-size:21px}.shortcuts{grid-template-columns:1fr}.top-actions .btn{padding:9px}.wrap{padding:10px}}
    .chat-list{display:grid;gap:10px}.chat-item{display:block;padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff}.chat-item:hover{border-color:var(--primary);transform:translateY(-1px)}.chat-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.chat-thread{display:grid;gap:10px;max-height:480px;overflow:auto;padding:8px 0}.chat-message{max-width:78%;padding:11px 13px;border-radius:14px;background:#f5eeeb}.chat-message.customer{margin-left:auto;background:var(--soft)}.chat-message small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.chat-compose{display:flex;gap:8px;margin-top:14px}.chat-compose input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.chat-compose button{white-space:nowrap}    .call-panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.call-panel video{width:min(260px,100%);border-radius:12px;background:#221}.call-panel audio{display:none}.call-overlay{position:fixed;inset:0;z-index:100;background:#211712dd;display:none;place-items:center;padding:20px}.call-overlay.show{display:grid}.call-card{width:min(520px,100%);padding:28px;border-radius:25px;background:#fffdfb;text-align:center;box-shadow:0 25px 80px #0008}.call-card h2{font:700 32px "Playfair Display";margin:8px 0}.call-video video{width:100%;max-height:360px;object-fit:cover;border-radius:16px;background:#1d1512}.call-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:800px){.wrap{padding:14px}.layout{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav a,.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.shortcuts{grid-template-columns:repeat(2,1fr)}.auth{grid-template-columns:1fr;margin:2vh auto}.auth-art{display:none}.hero{display:block}.two{grid-template-columns:1fr}}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat b{font-size:21px}.shortcuts{grid-template-columns:1fr}.top-actions .btn{padding:9px}.wrap{padding:10px}}
  </style>
</head>
<body><div id="app"></div><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
const API=(window.NAKODA_API_BASE||'https://nakoda-api.onrender.com').replace(/\/$/,''), token=()=>localStorage.getItem('nakoda_token')||'', user=()=>JSON.parse(localStorage.getItem('nakoda_user')||'null');
const path=location.pathname;
async function api(url,opts={}){let res;try{res=await fetch(API+url,{...opts,headers:{'Content-Type':'application/json',...(token()?{Authorization:'Bearer '+token()}:{}),...(opts.headers||{})}})}catch(error){throw Error('Unable to reach the Nakoda server. Please check your connection and try again.')}const data=await res.json().catch(()=>({}));if(res.status===401){localStorage.removeItem('nakoda_token');localStorage.removeItem('nakoda_user');location.href='/login?next='+encodeURIComponent(path);return Promise.reject(Error('Authentication required.'))}if(!res.ok)throw Error(data.error||'Request failed');return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v)||0)}
function initials(n){return (n||'U').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function logout(){if(confirm('Are you sure you want to log out?')){localStorage.removeItem('nakoda_token');localStorage.removeItem('nakoda_user');location.href='/'}}
function shell(active,body){const u=user()||{};return `<div class="wrap"><header class="top"><a class="brand" href="/"><span class="mark">N</span><span><b>Nakoda</b><small>Kitchen • Home • Everyday</small></span></a><div class="top-actions"><a class="btn outline" href="/">Continue shopping</a><button class="btn soft" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="side"><div class="side-user"><div class="avatar">${esc(initials(u.name||u.username))}</div><strong>${esc(u.name||u.username||'Customer')}</strong><small>${esc(u.email||'')}</small></div><nav class="nav">${[['account','My Account'],['account/orders','My Orders'],['account/addresses','Addresses'],['account/wishlist','Wishlist'],['account/recently-viewed','Recently Viewed'],['account/transactions','Transactions'],['account/notifications','Notifications'],['account/help','Help & Support'],['account/profile','Settings / Profile']].map(x=>`<a class="${active===x[0]?'active':''}" href="/${x[0]}">${x[1]}</a>`).join('')}<button class="logout" onclick="logout()">Logout</button></nav></aside><main class="content">${body}</main></div></div>`}
function fail(e){document.querySelectorAll('.error').forEach(x=>x.textContent=e.message)}
async function dashboard(){const d=await api('/api/account');const s=d.summary;document.getElementById('app').innerHTML=shell('account',`<section class="hero"><div><span class="eyebrow">Your Nakoda account</span><h1>Welcome back, ${esc(d.user.name)}</h1><p class="muted">Everything you need for a smoother, more personal shopping journey.</p></div><a class="btn primary" href="/account/profile">Edit profile</a></section><div class="grid"><div class="stat"><small>Total orders</small><b>${s.total_orders}</b></div><div class="stat"><small>Active orders</small><b>${s.active_orders}</b></div><div class="stat"><small>Delivered</small><b>${s.delivered_orders}</b></div><div class="stat"><small>Cancelled</small><b>${s.cancelled_orders}</b></div></div><div class="shortcuts">${[['📦','My Orders','/account/orders'],['♡','Wishlist','/account/wishlist'],['⌂','Addresses','/account/addresses'],['₹','Transactions','/account/transactions'],['◷','Recently Viewed','/account/recently-viewed'],['🔔','Notifications ('+d.unread_notifications+')','/account/notifications']].map(x=>`<a class="shortcut" href="${x[2]}"><span>${x[0]}</span>${x[1]}</a>`).join('')}</div><section class="card"><h2>Recent orders</h2>${d.orders.length?d.orders.map(orderCard).join(''):'<div class="empty">Your order history will appear here.</div>'}</section>`)}
function orderCard(o){const canCancel=['placed','confirmed','processing','packed'].includes(o.status);return `<div class="order"><div><h3>${esc(o.order_number)}</h3><span class="muted">${new Date(o.created_at).toLocaleDateString('en-IN')} · ${o.items?.map(i=>esc(i.product_name)).join(', ')||'Items'}</span><div><b>${money(o.total)}</b></div></div><div><span class="tag ${o.status==='cancelled'?'cancelled':''}">${esc(o.status.replaceAll('_',' '))}</span><br><a class="btn soft" href="/account/orders/${o.order_number}">View details</a><button class="btn outline" onclick="orderAction('${o.order_number}','buy-again')">Buy again</button>${canCancel?`<button class="btn outline" onclick="orderAction('${o.order_number}','cancel')">Cancel</button>`:''}<a class="btn outline" href="/account/help">Support</a></div></div>`}
async function orderAction(number,action){if(action==='cancel'&&!confirm('Cancel this order?'))return;try{await api('/api/account/orders/'+number+'/'+action,{method:'POST'});location.reload()}catch(e){alert(e.message)}}
async function orders(){const d=await api('/api/account/orders'+(location.search||''));document.getElementById('app').innerHTML=shell('account/orders',`<div class="hero"><div><span class="eyebrow">Order history</span><h1>My orders</h1></div></div><div class="card"><div class="top-actions" style="margin-bottom:10px">${['all','active','delivered','cancelled','returned'].map(x=>`<a class="btn ${new URLSearchParams(location.search).get('status')===x?'soft':'outline'}" href="/account/orders?status=${x}">${x[0].toUpperCase()+x.slice(1)}</a>`).join('')}</div>${d.orders.length?d.orders.map(orderCard).join(''):'<div class="empty">No orders found for this filter.</div>'}</div>`)}
async function detail(){const d=await api('/api/account/orders/'+encodeURIComponent(path.split('/').pop()));const o=d.order,tx=(o.transactions||[])[0];const states=['placed','confirmed','processing','packed','out_for_delivery','delivered'];const current=states.indexOf(o.status);document.getElementById('app').innerHTML=shell('account/orders',`<div class="hero"><div><span class="eyebrow">Order ${esc(o.order_number)}</span><h1>Order details</h1><p class="muted">${new Date(o.created_at).toLocaleString('en-IN')}</p></div><a class="btn soft" href="/account/orders/${o.order_number}/tracking">Track order</a></div><section class="card"><h2>Delivery timeline</h2><div class="timeline">${states.map((s,i)=>{const h=o.timeline.find(x=>x.status===s);return `<div class="step ${i<=current?'done':''}"><i></i><div><b>${s.replaceAll('_',' ')}</b><small class="muted">${h?.created_at?new Date(h.created_at).toLocaleString('en-IN'):''}</small></div></div>`}).join('')}</div></section><section class="card"><h2>Items & payment</h2><div class="items">${o.items.map(i=>`<div class="item">${i.image_url?`<img src="${esc(i.image_url)}" alt="">`:''}<div style="flex:1"><b>${esc(i.product_name)}</b><div class="muted">Qty ${i.quantity} · ${money(i.unit_price)}</div></div><b>${money(i.unit_price*i.quantity)}</b></div>`).join('')}</div><p>Payment: <b>${esc(o.payment_method)}</b> · ${esc(o.payment_status)}</p>${o.payment_method==='UPI'&&tx?`<p>UPI transaction ID / UTR: <b>${esc(tx.utr||'—')}</b>${tx.payment_note?`<br><span class="muted">Note: ${esc(tx.payment_note)}</span>`:''}</p>`:''}<p>Delivery: ${esc(o.full_name)}, ${esc(o.phone)}<br>${esc(o.address)}</p><div class="row"><b>Subtotal</b><b>${money(o.subtotal||o.total)}</b></div><div class="row"><b>Delivery</b><b>${money(o.delivery_charge)}</b></div><div class="row"><b>Final total</b><b>${money(o.total)}</b></div></section>`)}
async function profile(){const u=user();document.getElementById('app').innerHTML=shell('account/profile',`<section class="card"><span class="eyebrow">Account settings</span><h1>Edit profile</h1><p class="muted">Changes are saved securely to your Nakoda account.</p><form class="form" id="profileForm"><label>Full name<input name="name" required value="${esc(u.name||u.username)}"></label><label>Email<input type="email" name="email" required value="${esc(u.email)}"></label><label>Mobile number<input name="phone" value="${esc(u.phone)}"></label><div class="error"></div><button class="btn primary">Save changes</button></form></section>`);document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();try{const data=await api('/api/account/profile',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});localStorage.setItem('nakoda_user',JSON.stringify(data.user));location.href='/account'}catch(x){fail(x)}}}
async function addresses(){const d=await api('/api/account/addresses');document.getElementById('app').innerHTML=shell('account/addresses',`<section class="card"><div class="row"><div><span class="eyebrow">Saved locations</span><h1>My addresses</h1></div><button class="btn primary" onclick="document.getElementById('addressForm').classList.toggle('hidden')">Add address</button></div><form class="form hidden" id="addressForm">${['full_name','mobile','house_flat','street','area','landmark','city','state','pincode'].map(x=>`<label>${x.replaceAll('_',' ')}<input name="${x}" required="${['area','landmark'].includes(x)?'false':'true'}"></label>`).join('')}<label>Type<select name="address_type"><option>HOME</option><option>WORK</option><option>OTHER</option></select></label><label><input type="checkbox" name="is_default"> Set as default</label><div class="error"></div><button class="btn primary">Save address</button></form><div id="addresses">${d.addresses.length?d.addresses.map(a=>`<article class="address"><div class="address-head"><b>${esc(a.full_name)} · ${esc(a.address_type)}</b>${a.is_default?'<span class="tag">Default</span>':''}</div><p>${esc(a.house_flat)}, ${esc(a.street)}, ${esc(a.area)}<br>${esc(a.city)}, ${esc(a.state)} - ${esc(a.pincode)}<br>${esc(a.mobile)}</p><button class="btn outline" onclick="deleteAddress(${a.id})">Delete</button>${!a.is_default?`<button class="btn soft" onclick="makeDefault(${a.id})">Set default</button>`:''}</article>`).join(''):'<div class="empty">No saved addresses yet.</div>'}</div></section>`);document.getElementById('addressForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.is_default=e.target.is_default.checked;try{await api('/api/account/addresses',{method:'POST',body:JSON.stringify(v)});addresses()}catch(x){fail(x)}}}
async function deleteAddress(id){if(confirm('Delete this address?')){await api('/api/account/addresses/'+id,{method:'DELETE'});addresses()}}async function makeDefault(id){await api('/api/account/addresses/'+id+'/default',{method:'POST'});addresses()}
async function wishlist(){const d=await api('/api/account/wishlist');document.getElementById('app').innerHTML=shell('account/wishlist',`<section class="card"><span class="eyebrow">Saved for later</span><h1>Wishlist</h1>${d.items.length?`<div class="items">${d.items.map(i=>`<div class="item"><img src="${esc(i.image_url||'')}" alt=""><div style="flex:1"><b>${esc(i.name)}</b><div>${money(i.price)} · ${i.stock_quantity>0?'In stock':'Out of stock'}</div></div><button class="btn outline" onclick="removeWish(${i.product_id})">Remove</button></div>`).join('')}</div>`:'<div class="empty">Your wishlist is empty.</div>'}</section>`)}async function removeWish(id){await api('/api/account/wishlist/'+id,{method:'DELETE'});wishlist()}
async function simple(pathname,title,active,render){const d=await api(pathname);document.getElementById('app').innerHTML=shell(active,`<section class="card"><span class="eyebrow">Nakoda account</span><h1>${title}</h1>${render(d)}</section>`)}
async function checkout(){const [d,upi]=await Promise.all([api('/api/cart'),api('/api/payment/upi-config')]);const subtotal=(d.items||[]).reduce((sum,i)=>sum+Number(i.price||0)*Number(i.quantity||0),0),total=subtotal+(subtotal>=999?0:49);document.getElementById('app').innerHTML=shell('account',`<section class="card"><span class="eyebrow">Secure checkout</span><h1>Complete your order</h1><div class="items">${(d.items||[]).map(i=>`<div class="item"><div style="flex:1"><b>${esc(i.name)}</b><div>Qty ${i.quantity} · ${money(i.price)}</div></div><b>${money(Number(i.price)*Number(i.quantity))}</b></div>`).join('')||'<div class="empty">Your cart is empty.</div>'}</div><div class="row" style="margin:16px 0"><b>Total</b><b>${money(total)}</b></div><form class="form" id="checkoutForm"><label>Full name<input name="full_name" required value="${esc(user()?.name)}"></label><label>Mobile<input name="phone" required value="${esc(user()?.phone)}"></label><label>Delivery address<textarea name="address" required rows="3"></textarea></label><label>Payment method<select name="payment_method" id="paymentMethod"><option value="COD">Cash on Delivery</option>${upi.enabled?'<option value="UPI">Pay via UPI</option>':''}</select></label><section id="upiPayment" class="notice hidden"><h2 style="margin-top:0">Pay via UPI</h2><p>Pay to: <b>${esc(upi.display_name)}</b></p><p>Amount to pay: <b>${money(total)}</b></p><p>UPI ID: <b id="upiId">${esc(upi.upi_id)}</b> <button type="button" class="btn soft" id="copyUpi">Copy UPI ID</button></p>${upi.qr_image_url?`<p>Scan & pay</p><img src="${esc(upi.qr_image_url)}" alt="Nakoda UPI QR code" style="width:180px;height:180px;object-fit:contain;border:1px solid var(--line);border-radius:12px">`:''}<p class="muted">After completing the payment, enter your UPI transaction details below.</p><label>UPI Transaction ID / UTR<input name="utr" id="utr" minlength="6" maxlength="100" pattern="[A-Za-z0-9][A-Za-z0-9 ._/:#-]{5,99}" placeholder="Enter UTR"></label><label>Payment note (optional)<input name="payment_note" maxlength="255"></label></section><div class="error"></div><button class="btn primary" id="placeOrder">Place order · COD</button></form></section>`);const form=document.getElementById('checkoutForm'),method=document.getElementById('paymentMethod'),upiPanel=document.getElementById('upiPayment'),submit=document.getElementById('placeOrder');const updatePayment=()=>{const isUpi=method.value==='UPI';upiPanel.classList.toggle('hidden',!isUpi);submit.textContent=isUpi?'I HAVE PAID':'Place order · COD';document.getElementById('utr').required=isUpi};method.onchange=updatePayment;updatePayment();document.getElementById('copyUpi')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(upi.upi_id);document.getElementById('copyUpi').textContent='Copied';}catch(x){alert('Copy failed. Please copy the UPI ID manually.')}});form.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));try{const o=await api('/api/orders',{method:'POST',body:JSON.stringify(body)});location.href='/account/orders/'+o.order_number}catch(x){fail(x)}}}
async function auth(mode){const next=new URLSearchParams(location.search).get('next')||'/account';document.getElementById('app').innerHTML=`<main class="wrap"><div class="auth card"><div class="auth-art"><span class="eyebrow" style="color:#ffd9c9">Nakoda account</span><h1>Shop smarter, live happier.</h1><p>Saved carts, faster checkout and real order tracking in one calm account center.</p></div><form class="auth-form" id="authForm"><h2>${mode==='login'?'Welcome back':'Create your account'}</h2><p class="muted">${mode==='login'?'Login to continue shopping.':'Join Nakoda for a better everyday shopping experience.'}</p><div class="form">${mode==='register'?'<label>Full name<input name="username" required></label><label>Email<input type="email" name="email" required></label><label>Mobile<input name="phone"></label>':'<label>Email or username<input name="username" required></label>'}<label>Password<input type="password" name="password" required minlength="6"></label>${mode==='register'?'<label>Confirm password<input type="password" name="confirmPassword" required></label>':''}<div class="error"></div><button class="btn primary">${mode==='login'?'Login':'Create account'}</button></div><p><a class="soft btn" href="/${mode==='login'?'register':'login'}">${mode==='login'?'Create account':'Login'}</a> <a href="/forgot-password">Forgot password?</a></p></form></div></main>`;document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await api('/api/'+(mode==='login'?'login':'register'),{method:'POST',body:JSON.stringify(data)});localStorage.setItem('nakoda_token',r.token);localStorage.setItem('nakoda_user',JSON.stringify(r.user));const guest=JSON.parse(localStorage.getItem('nakoda_guest_cart')||'[]');if(guest.length){await api('/api/cart/merge',{method:'POST',body:JSON.stringify({items:guest})});localStorage.removeItem('nakoda_guest_cart')}location.href=next}catch(x){fail(x)}}}
async function recovery(reset){document.getElementById('app').innerHTML=`<main class="wrap"><div class="auth card"><div class="auth-art"><h1>Secure account recovery.</h1><p>Reset your Nakoda password safely.</p></div><form class="auth-form" id="recovery"><h2>${reset?'Choose a new password':'Forgot password?'}</h2><p class="muted">${reset?'Enter the reset token from your email.':'We will send reset instructions if the email is registered.'}</p><div class="form">${reset?'<label>Reset token<input name="token" required></label>':'<label>Email<input type="email" name="email" required></label>'}${reset?'<label>New password<input type="password" name="password" minlength="6" required></label>':''}<div class="error"></div><button class="btn primary">${reset?'Reset password':'Send instructions'}</button></div><p><a href="/login">Back to login</a></p></form></div></main>`;document.getElementById('recovery').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/'+(reset?'reset-password':'forgot-password'),{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.querySelector('.error').textContent=r.reset_token?`Reset token: ${r.reset_token}`:r.message;if(reset)setTimeout(()=>location.href='/login',800)}catch(x){fail(x)}}}
async function start(){
  if(path==='/login'||path==='/register') return auth(path==='/login'?'login':'register');
  if(path==='/forgot-password') return recovery(false);
  if(path==='/reset-password') return recovery(true);
  if(!token()){ location.href='/login?next='+encodeURIComponent(path); return; }
  if(path==='/account') return dashboard();
  if(path==='/account/orders') return orders();
  if(path==='/account/checkout') return checkout();
  if(path.endsWith('/tracking')) { location.href=path.replace('/tracking',''); return; }
  if(path.startsWith('/account/orders/')) return detail();
  if(path==='/account/profile'||path==='/account/settings') return profile();
  if(path==='/account/addresses') return addresses();
  if(path==='/account/wishlist') return wishlist();
  if(path==='/account/recently-viewed') return simple('/api/account/recently-viewed','Recently viewed','account/recently-viewed',d=>d.items.length?d.items.map(i=>'<div class="item"><img src="'+esc(i.image_url||'')+'" alt=""><b>'+esc(i.name)+'</b><span>'+money(i.price)+'</span></div>').join(''):'<div class="empty">Products you view will appear here.</div>');
  if(path==='/account/transactions') return simple('/api/account/transactions','Transactions','account/transactions',d=>d.transactions.length?d.transactions.map(t=>'<div class="transaction row"><div><b>'+esc(t.utr||t.transaction_id)+'</b><div class="muted">'+esc(t.order_number||'')+' · '+esc(t.payment_method)+' · '+(t.created_at?new Date(t.created_at).toLocaleDateString('en-IN'):'')+'</div></div><strong>'+money(t.amount)+' · '+esc(t.status)+'</strong></div>').join(''):'<div class="empty">No transactions yet.</div>');
  if(path==='/account/notifications') return simple('/api/account/notifications','Notifications','account/notifications',d=>'<button class="btn soft" onclick="api(\'/api/account/notifications/read-all\',{method:\'POST\'}).then(()=>location.reload())">Mark all as read</button>'+(d.notifications.length?d.notifications.map(n=>'<article class="notice" style="'+(n.is_read?'':'background:#fff5ef')+'"><div class="row"><a href="'+(n.order_number?'/account/orders/'+encodeURIComponent(n.order_number):'#')+'"><b>'+esc(n.title)+'</b></a>'+(n.is_read?'':'<button class="btn outline" onclick="event.preventDefault();api(\'/api/account/notifications/'+n.id+'/read\',{method:\'POST\'}).then(()=>location.reload())">Mark read</button>')+'</div><p>'+esc(n.message)+'</p><small class="muted">'+(n.created_at?new Date(n.created_at).toLocaleString('en-IN'):'')+'</small></article>').join(''):'<div class="empty">You are all caught up.</div>'));
  if(path==='/account/help') return supportInbox();
  if(path==='/account/help/new') return supportNew();
  if(path.startsWith('/account/help/chat/')) return supportChat(path.split('/').pop());
  return dashboard();
}start().catch(e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="card"><h1>Account unavailable</h1><p class="muted">'+esc(e.message)+'</p><a class="btn primary" href="/">Back to Nakoda</a></div></div>'});
async function supportInbox(){const d=await api('/api/account/support/conversations');document.getElementById('app').innerHTML=shell('account/help',`<div class="hero"><div><span class="eyebrow">NAKODA SUPPORT</span><h1>Chat with NAKODA</h1><p class="muted">Talk directly to our support team about orders, payments, delivery or returns.</p></div><a class="btn primary" href="/account/help/new">Start a chat</a></div><section class="card"><div class="chat-list">${(d.conversations||[]).map(c=>`<a class="chat-item" href="/account/help/chat/${c.id}"><div class="chat-head"><div><b>${esc(c.subject||c.reason||'Support conversation')}</b><div class="muted">${esc(c.last_message||c.last_message_body||'Open conversation to view messages')}</div></div><span class="tag">${esc(c.status||'open')}</span></div><small class="muted">${c.updated_at?new Date(c.updated_at).toLocaleString('en-IN'):''}</small></a>`).join('')||'<div class="empty">No conversations yet. Start a chat and we will help you.</div>'}</div></section>`)}
async function supportNew(){const orders=await api('/api/account/orders?status=all');document.getElementById('app').innerHTML=shell('account/help',`<section class="card"><span class="eyebrow">NAKODA SUPPORT</span><h1>Start a chat</h1><p class="muted">Choose a topic and send your message to the Nakoda team.</p><form class="form" id="supportForm"><label>Topic<select name="reason"><option>Order Issue</option><option>Delivery Issue</option><option>Payment Issue</option><option>Return/Refund</option><option>Product Question</option><option>Product Availability</option><option>Account Issue</option><option>General Enquiry</option><option>Other</option></select></label><label>Order (optional)<select name="order_number"><option value="">Not related to an order</option>${(orders.orders||[]).map(o=>`<option value="${esc(o.order_number)}">${esc(o.order_number)}</option>`).join('')}</select></label><label>Message<textarea name="message" required rows="5" placeholder="How can we help?"></textarea></label><div class="error"></div><button class="btn primary">Start conversation</button></form></section>`);document.getElementById('supportForm').onsubmit=async e=>{e.preventDefault();try{const b=Object.fromEntries(new FormData(e.target)),d=await api('/api/account/support/conversations',{method:'POST',body:JSON.stringify({subject:b.reason,reason:b.reason,order_number:b.order_number,message:b.message})});location.href='/account/help/chat/'+d.conversation.id}catch(x){fail(x)}}}
let nakodaSocket,nakodaPc,nakodaStream,nakodaCallId,nakodaConversationId,nakodaCallType,nakodaPendingSignals=[],nakodaPendingIce=[],nakodaTimer,nakodaStartedAt;
function callMessage(m){const body=String(m.message||m.body||''),call=body.match(/^\[\[NAKODA_CALL:[^:]+:(voice|video)\]\]$/);return `<div class="chat-message ${m.sender_type==='CUSTOMER'?'customer':''}"><b>${esc(m.sender_name||m.sender_type||'Support')}</b><div>${call?`Started a ${call[1]} call` : esc(body)}</div><small>${m.created_at?new Date(m.created_at).toLocaleString('en-IN'):''}</small></div>`}
function callOverlay(){if(document.getElementById('nakodaCallOverlay'))return;document.body.insertAdjacentHTML('beforeend','<div id="nakodaCallOverlay" class="call-overlay"><div class="call-card"><div class="eyebrow">NAKODA VOICE CALL</div><h2 id="callTitle">Incoming call</h2><p id="callStatus">Calling…</p><div id="callTimer" class="muted">00:00</div><audio id="remoteCallAudio" autoplay playsinline></audio><button class="btn soft hidden" id="enableCallAudio">Enable audio</button><div class="call-actions"><button class="btn primary" id="acceptCall">Accept</button><button class="btn danger" id="declineCall">Decline</button><button class="btn soft" id="messageCaller">Message</button><button class="btn soft hidden" id="muteCall">Mute</button><button class="btn danger hidden" id="endCall">End call</button></div></div></div>');document.getElementById('enableCallAudio').onclick=playNakodaRemoteAudio}
function showCall(type,title,status){callOverlay();document.getElementById('nakodaCallOverlay').classList.add('show');document.getElementById('callTitle').textContent=title;document.getElementById('callStatus').textContent=status;document.getElementById('acceptCall').classList.toggle('hidden',status!=='Incoming call');document.getElementById('declineCall').classList.toggle('hidden',status!=='Incoming call');document.getElementById('messageCaller').classList.toggle('hidden',status!=='Incoming call');document.getElementById('muteCall').classList.toggle('hidden',status!=='Connected');document.getElementById('endCall').classList.toggle('hidden',status==='Incoming call');document.getElementById('endCall').onclick=endNakodaCall;document.getElementById('muteCall').onclick=toggleNakodaMute}
function closeCall(){nakodaPc?.close();nakodaPc=null;nakodaStream?.getTracks().forEach(t=>t.stop());nakodaStream=null;clearInterval(nakodaTimer);const overlay=document.getElementById('nakodaCallOverlay');if(overlay)overlay.classList.remove('show');const audio=document.getElementById('remoteCallAudio');if(audio)audio.srcObject=null}
function setupCallSocket(id){nakodaSocket?.disconnect();nakodaConversationId=Number(id);nakodaSocket=io(API,{auth:{token:token()}});const join=()=>nakodaConversationId&&nakodaSocket.emit('support_join',{conversation_id:nakodaConversationId});nakodaSocket.on('connect',join);nakodaSocket.on('connect_error',e=>console.error('Nakoda call socket connection failed',e));if(nakodaSocket.connected)join();nakodaSocket.on('incoming_call',d=>{nakodaCallId=d.call_id;nakodaPendingSignals=[];nakodaPendingIce=[];showCall('voice',`${d.caller_name} is calling`,'Incoming call');document.getElementById('acceptCall').onclick=()=>acceptCall();document.getElementById('declineCall').onclick=()=>respondCall('rejected');document.getElementById('messageCaller').onclick=()=>{closeCall();document.querySelector('[name="message"]')?.focus()}});nakodaSocket.on('call_response',d=>{if(d.call_id!==nakodaCallId)return;if(d.response==='accepted'){showCall('voice','Connecting…','Connecting…');if(nakodaPc?.localDescription)nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:nakodaPc.localDescription})}if(d.response==='rejected'){showCall('voice','Call rejected','NAKODA Support is unavailable right now.');setTimeout(closeCall,1800)}});nakodaSocket.on('call_state',d=>{if(d.call_id!==nakodaCallId)return;if(d.state==='CONNECTED')startNakodaTimer();if(d.state==='ENDED'||d.state==='REJECTED'){showCall('voice',d.state==='ENDED'?'Call ended':'Call rejected',d.state==='ENDED'?'The other person ended the call':'NAKODA Support is unavailable right now.');setTimeout(closeCall,1200)}});nakodaSocket.on('call_signal',async d=>{if(d.call_id!==nakodaCallId)return;const signal=d.signal;try{if(signal.type==='offer'&&!nakodaPc){nakodaPendingSignals.push(signal);return}if(signal.type==='offer'){await nakodaPc.setRemoteDescription(signal);for(const candidate of nakodaPendingIce.splice(0))await nakodaPc.addIceCandidate(candidate);const answer=await nakodaPc.createAnswer();await nakodaPc.setLocalDescription(answer);nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:answer})}else if(signal.type==='answer'&&nakodaPc){await nakodaPc.setRemoteDescription(signal);for(const candidate of nakodaPendingIce.splice(0))await nakodaPc.addIceCandidate(candidate)}else if(signal.candidate&&nakodaPc){if(nakodaPc.remoteDescription)await nakodaPc.addIceCandidate(signal);else nakodaPendingIce.push(signal)}}catch(e){console.error('Nakoda call signaling failed',e)}})}
function playNakodaRemoteAudio(){const audio=document.getElementById('remoteCallAudio');if(!audio||!audio.srcObject)return;audio.muted=false;audio.volume=1;audio.play().then(()=>document.getElementById('enableCallAudio')?.classList.add('hidden')).catch(e=>{console.error('Nakoda remote audio playback failed',e);document.getElementById('enableCallAudio')?.classList.remove('hidden')})}
function prepareNakodaPeer(){nakodaPc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});nakodaPc.onconnectionstatechange=()=>{console.log('Nakoda peer connection state',nakodaPc.connectionState);if(nakodaPc.connectionState==='connected'){showCall('voice','Connected','Call connected');startNakodaTimer();nakodaSocket.emit('call_state',{conversation_id:nakodaConversationId,call_id:nakodaCallId,state:'CONNECTED'})}if(['failed','disconnected','closed'].includes(nakodaPc.connectionState))endNakodaCall(false)};nakodaPc.ontrack=e=>{const audio=document.getElementById('remoteCallAudio');if(!audio)return;audio.srcObject=e.streams?.[0]||new MediaStream([e.track]);playNakodaRemoteAudio()};nakodaPc.onicecandidate=e=>e.candidate&&nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:{candidate:e.candidate}})}
async function prepareCall(id){if(!nakodaSocket)setupCallSocket(id);nakodaCallId=crypto.randomUUID();nakodaCallType='voice';prepareNakodaPeer();nakodaStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});nakodaStream.getTracks().forEach(track=>nakodaPc.addTrack(track,nakodaStream));const offer=await nakodaPc.createOffer();await nakodaPc.setLocalDescription(offer);nakodaSocket.emit('call_invite',{conversation_id:nakodaConversationId,call_id:nakodaCallId,call_type:'voice',caller_name:(user()||{}).name||'Customer'});nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:offer});showCall('voice','Calling NAKODA…','Ringing…')}
async function startNakodaCall(id){try{setupCallSocket(id);await prepareCall(id)}catch(e){fail(e)}}
async function acceptCall(){try{nakodaSocket.emit('call_response',{conversation_id:nakodaConversationId,call_id:nakodaCallId,response:'accepted'});prepareNakodaPeer();nakodaStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});nakodaStream.getTracks().forEach(track=>nakodaPc.addTrack(track,nakodaStream));showCall('voice','Connecting…','Connecting…');const offer=nakodaPendingSignals.shift();if(offer){await nakodaPc.setRemoteDescription(offer);const answer=await nakodaPc.createAnswer();await nakodaPc.setLocalDescription(answer);nakodaSocket.emit('call_signal',{conversation_id:nakodaConversationId,call_id:nakodaCallId,signal:answer})}}catch(e){fail(e)}}
function startNakodaTimer(){if(nakodaTimer)return;nakodaStartedAt=Date.now();nakodaTimer=setInterval(()=>{const seconds=Math.floor((Date.now()-nakodaStartedAt)/1000),node=document.getElementById('callTimer');if(node)node.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`},1000)}
function toggleNakodaMute(){if(!nakodaStream)return;const track=nakodaStream.getAudioTracks()[0];track.enabled=!track.enabled;document.getElementById('muteCall').textContent=track.enabled?'Mute':'Unmute'}
function endNakodaCall(notify=true){if(notify)nakodaSocket?.emit('call_end',{conversation_id:nakodaConversationId,call_id:nakodaCallId});closeCall()}
function respondCall(response){nakodaSocket?.emit('call_response',{conversation_id:nakodaConversationId,call_id:nakodaCallId,response});closeCall()}
async function supportChat(id){const d=await api('/api/account/support/conversations/'+encodeURIComponent(id));const c=d.conversation||d,closed=String(c.status||'').toLowerCase()==='closed';document.getElementById('app').innerHTML=shell('account/help',`<section class="card"><div class="hero"><div><span class="eyebrow">NAKODA SUPPORT</span><h1>${esc(c.subject||c.reason||'Support conversation')}</h1><p class="muted">We're here to help · ${esc(c.status||'open')}</p></div><div><button class="btn soft" onclick="startNakodaCall('${id}')">Voice call</button> <button class="btn outline" id="closeChat" ${closed?'disabled':''}>Close</button></div></div><div id="callPanel" class="call-panel hidden"></div><div class="chat-thread">${(c.messages||d.messages||[]).map(m=>callMessage(m,id)).join('')||'<div class="empty">Send your first message below.</div>'}</div><form class="chat-compose" id="chatForm" ${closed?'style="display:none"':''}><input name="message" required placeholder="Type your message…"><button class="btn primary">Send</button></form></section>`);document.getElementById('chatForm')?.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/account/support/conversations/'+encodeURIComponent(id)+'/messages',{method:'POST',body:JSON.stringify({message:new FormData(e.target).get('message')})});supportChat(id)}catch(x){fail(x)}});document.getElementById('closeChat').onclick=async()=>{await api('/api/account/support/conversations/'+encodeURIComponent(id)+'/close',{method:'POST'});supportChat(id)}}start().catch(e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="card"><h1>Account unavailable</h1><p class="muted">'+esc(e.message)+'</p><a class="btn primary" href="/">Back to Nakoda</a></div></div>'});
</script></body></html>
